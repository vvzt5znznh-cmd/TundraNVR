camera:
  name: building
  source: 0
  width: 1280
  height: 720
  loop_file: false

pipeline:
  detect_fps: 5
  live_fps: 10
  jpeg_quality: 80
  idle_detect_seconds: 8

motion:
  min_area: 1500
  threshold: 25
  blur_ksize: 21

detection:
  model: yolov8n.pt
  conf: 0.4
  classes:
    - person
    - bicycle
    - car
    - motorcycle
    - bus
    - truck
    - bird
    - cat
    - dog
    - backpack
    - handbag
    - suitcase
    - umbrella
    - skateboard
    - airplane
    - drone
  device: cpu

tracking:
  # Wall-clock seconds since last Detect observe. Was tick-count `max_age`.
  max_age_s: 15
  min_hits: 2
  iou_match: 0.3
  dedup_seconds: 8

events:
  pre_seconds: 2
  post_seconds: 4
  cooldown_seconds: 8
  retention_days: 7
  clip_fps: 10

server:
  host: 0.0.0.0
  port: 8000
  # Optional. When set (or TUNDRANVR_API_TOKEN), GET /api/events, GET /media,
  # PUT /api/settings, and POST /api/events/{id}/review require
  # Authorization: Bearer <token> or X-API-Token. Live MJPEG stays open.
  # Empty token = no auth; the UI shows a NO AUTH pill.
  api_token: ""

escalation:
  # auto: recall while Verify is healthy, else pol_score.
  # recall: any plausible Detect trip goes to Verify (eval / healthy suppressor).
  # pol_score: legacy gate on Pattern of Life score ≥ pol_score_min.
  mode: auto
  pol_score_min: 0.7

# Roadmap model at each seat. `running` in /health is what this process loads.
targets:
  edge: OpenCV + Pattern of Life (no neural net)
  node: RF-DETR
  hub: Moondream 3

vision:
  enabled: true
  provider: local
  allow_cloud: false
  ollama_url: http://127.0.0.1:11434
  ollama_model: moondream
  openai_model: gpt-4o-mini
  timeout_seconds: 25
  audit_rate: 0.03
  verify_fresh_seconds: 120
  policy: >
    Fixed building camera. Alert on unattended bags and after-hours people
    with no badge in the last minute. Ordinary doorway traffic is normal.

fusion:
  enabled: true
  badge_window_seconds: 60
  fixture: data/fusion/badges.jsonl

mqtt:
  enabled: false
  host: 127.0.0.1
  port: 1883
  prefix: tundranvr

embed:
  enabled: true
  knn: 5
  gate_alerts: false

zones:
  - name: doorway
    polygon: [[0.0, 0.35], [1.0, 0.35], [1.0, 1.0], [0.0, 1.0]]

monitoring:
  expected_classes:
    - person
    - bicycle
    - car
    - motorcycle
    - bus
    - truck
    - backpack
    - handbag
    - suitcase
    - umbrella
    - dog
    - cat
    - bird
    - skateboard
  alert_classes:
    - drone
    - airplane
  unattended_bags: true
  bag_dwell_seconds: 8
  bag_person_radius: 120
