camera:
  name: building
  source: 0
  width: 1280
  height: 720
  loop_file: false

pipeline:
  detect_fps: 5
  live_fps: 10
  jpeg_quality: 80
  idle_detect_seconds: 8

motion:
  min_area: 1500
  threshold: 25
  blur_ksize: 21

detection:
  model: yolov8n.pt
  # YOLO predict floor; class_conf raises vehicle floors after predict.
  conf: 0.45
  # Drop parking-line / shadow / frame-edge ghosts before tracking.
  min_box_area_frac: 0.0012
  min_side_px: 24
  edge_margin_frac: 0.02
  edge_reject: true
  class_conf:
    car: 0.55
    truck: 0.55
    bus: 0.55
    motorcycle: 0.5
    bicycle: 0.5
    person: 0.45
    airplane: 0.55
    drone: 0.55
  # Review cards label the trip track, not every coincident FP in the frame.
  primary_track_boxes: true
  classes:
    - person
    - bicycle
    - car
    - motorcycle
    - bus
    - truck
    - bird
    - cat
    - dog
    - backpack
    - handbag
    - suitcase
    - umbrella
    - skateboard
  device: cpu
  # Stock YOLOv8n has no drone class. Secondary UAV weights from
  # scripts/download_sample.py (drone-yolo.pt). Empty = skip.
  drone_model: drone-yolo.pt
  drone_conf: 0.55

tracking:
  # Wall-clock seconds since last Detect observe.
  max_age_s: 15
  # Need a second confirm before naming — cuts one-frame pavement ghosts.
  min_hits: 3
  iou_match: 0.3
  dedup_seconds: 8

events:
  pre_seconds: 2
  post_seconds: 4
  cooldown_seconds: 8
  retention_days: 7
  clip_fps: 10

server:
  host: 0.0.0.0
  port: 8000
  # Optional. When set (or TUNDRANVR_API_TOKEN), GET /api/events, GET /media,
  # PUT /api/settings, and POST /api/events/{id}/review require
  # Authorization: Bearer <token> or X-API-Token. Live MJPEG stays open.
  # Empty token = no auth; the UI shows a NO AUTH pill.
  api_token: ""

escalation:
  # auto: recall while Verify is healthy, else pol_score.
  # recall: any Detect trip goes to Verify.
  # pol_score: Edge unusual-score gate when Verify is down.
  mode: auto
  pol_score_min: 0.7

# Showcase demos only. Sample/fixture never absorb into Pattern of Life.
# When page_review is true, allowlisted clips (lobby / package / courtyard /
# drones — see app/samples.py) may page Review after the session sketch is
# confident. Default false keeps anonymous looping files off the operator shelf.
demo:
  page_review: false

# What this process actually loads. Not a roadmap.

targets:
  edge: OpenCV + Pattern of Life (no neural net)
  node: YOLOv8n
  hub: Moondream

vision:
  enabled: true
  provider: local
  allow_cloud: false
  ollama_url: http://127.0.0.1:11434
  ollama_model: moondream
  openai_model: gpt-4o-mini
  timeout_seconds: 25
  audit_rate: 0.03
  verify_fresh_seconds: 120
  policy: >
    Fixed building camera. Alert on unattended bags and after-hours people.
    Ordinary doorway traffic is normal.

# Optional TypeSafe Jev page/suppress gate (spike). Structured trip state only
# — never frames. Remote calls need allow_cloud: true plus OPENROUTER_API_KEY
# (or TYPESAFE_API_KEY). Fail-open when disabled / denied / unreachable.
# provider: openrouter | mock  (mock = offline deterministic path for smoke)
jev:
  enabled: true
  allow_cloud: true
  provider: openrouter   # or mock
  model: typesafe/jev-1.13
  base_url: https://openrouter.ai/api/alpha/decisions
  timeout_seconds: 2.0
  page_threshold: 0.75
  suppress_threshold: 0.35
  # dry_run: true        # log only, don’t apply

# Side channels remain off the decision path (cascade freeze).
fusion:
  enabled: false
  badge_window_seconds: 60
  fixture: data/fusion/badges.jsonl

mqtt:
  enabled: false
  host: 127.0.0.1
  port: 1883
  prefix: tundranvr

embed:
  enabled: false
  knn: 5
  gate_alerts: false


zones:
  - name: doorway
    polygon: [[0.0, 0.35], [1.0, 0.35], [1.0, 1.0], [0.0, 1.0]]

monitoring:
  unattended_bags: true
  bag_dwell_seconds: 8
  bag_person_radius: 120
