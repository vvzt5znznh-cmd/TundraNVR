camera:
  # File path, RTSP/HTTP URL, or camera index (0). File sources loop by default.
  source: data/samples/entrance.mp4
  width: 1280
  height: 720
  loop_file: true

pipeline:
  detect_fps: 5
  live_fps: 10
  jpeg_quality: 80

motion:
  min_area: 1500
  threshold: 25
  blur_ksize: 21

detection:
  model: yolov8n.pt
  conf: 0.4
  # Second model (YOLOv8n) trained to spot quadcopters and fixed-wing UAVs.
  drone_model: drone-yolo.pt
  drone_conf: 0.45
  classes:
    - person
    - bicycle
    - car
    - motorcycle
    - bus
    - truck
    - bird
    - cat
    - dog
    - backpack
    - handbag
    - suitcase
    - umbrella
    - skateboard
    - airplane
    - drone
  device: cpu

events:
  pre_seconds: 2
  post_seconds: 4
  cooldown_seconds: 8
  retention_days: 7
  clip_fps: 10

server:
  host: 0.0.0.0
  port: 8000

vision:
  enabled: true
  # auto tries Ollama, then OPENAI_API_KEY, then a YOLO-based note.
  provider: auto
  ollama_url: http://127.0.0.1:11434
  ollama_model: moondream
  openai_model: gpt-4o-mini
  timeout_seconds: 25

monitoring:
  # Ordinary for a building camera. Anything else is flagged.
  expected_classes:
    - person
    - bicycle
    - car
    - motorcycle
    - bus
    - truck
    - backpack
    - handbag
    - suitcase
    - umbrella
    - dog
    - cat
    - bird
    - skateboard
  alert_classes:
    - drone
    - airplane
  unattended_bags: true
