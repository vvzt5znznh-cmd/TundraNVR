name: eval-smoke
on:
  push:
    branches: ["main", "cursor/**"]
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn opencv-python-headless pyyaml numpy python-multipart
      - name: Ablation smoke
        run: python scripts/eval.py --smoke --out data/eval/ablation
