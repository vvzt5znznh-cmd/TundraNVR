<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TundraNVR — Live</title>
  <style>
    :root {
      --bg: #121418;
      --panel: #1c2027;
      --line: #2b313c;
      --text: #e8eaed;
      --muted: #9aa3b2;
      --accent: #7eb8ff;
      --ok: #6fdd8b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }
    .brand { display: flex; align-items: baseline; gap: 10px; }
    header h1 { font-size: 16px; margin: 0; letter-spacing: 0.04em; }
    #version {
      color: var(--muted);
      font-size: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    nav a {
      color: var(--accent);
      text-decoration: none;
      margin-left: 16px;
      font-size: 14px;
    }
    main { padding: 20px; display: grid; gap: 16px; max-width: 1100px; margin: 0 auto; }
    .live {
      background: #000;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      min-height: 240px;
    }
    .live img { width: 100%; display: block; background: #000; }
    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 20px;
      color: var(--muted);
      font-size: 13px;
    }
    .dot { color: var(--ok); }
    .dets { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .settings {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
      display: grid;
      gap: 12px;
    }
    .settings h2 { margin: 0; font-size: 14px; font-weight: 600; }
    .settings p { margin: 0; color: var(--muted); font-size: 13px; }
    .fields {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 12px;
      align-items: end;
    }
    @media (max-width: 800px) { .fields { grid-template-columns: 1fr; } }
    label { display: grid; gap: 6px; font-size: 12px; color: var(--muted); }
    input {
      background: #121418;
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px 10px;
      font: inherit;
    }
    button {
      background: var(--accent);
      color: #101318;
      border: 0;
      border-radius: 6px;
      padding: 9px 14px;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: default; }
    .msg { font-size: 13px; color: var(--muted); min-height: 1.2em; }
    .msg.err { color: #ff8b8b; }
    .msg.ok { color: var(--ok); }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <h1>TundraNVR</h1>
      <span id="version"></span>
    </div>
    <nav>
      <a href="/">Live</a>
      <a href="/events">Events</a>
    </nav>
  </header>
  <main>
    <div class="live">
      <img id="stream" alt="Live camera" src="/api/stream.mjpg" />
    </div>
    <div class="meta">
      <span id="status"><span class="dot">●</span> connecting</span>
      <span id="source"></span>
      <span id="fps"></span>
      <span id="motion"></span>
      <span class="dets" id="dets"></span>
    </div>
    <form class="settings" id="settings">
      <h2>Source and model</h2>
      <p>File path, webcam index (<code>0</code>), or RTSP/HTTP URL. A new model name is downloaded on first use.</p>
      <div class="fields">
        <label>Video source
          <input id="sourceInput" name="source" autocomplete="off" spellcheck="false"
            placeholder="data/sample.mp4" />
        </label>
        <label>YOLO model
          <input id="modelInput" name="model" list="modelOptions" autocomplete="off" spellcheck="false"
            placeholder="yolov8n.pt" />
        </label>
        <button type="submit" id="apply">Apply</button>
      </div>
      <datalist id="modelOptions"></datalist>
      <div class="msg" id="settingsMsg"></div>
    </form>
  </main>
  <script>
    async function refreshHealth() {
      try {
        const res = await fetch("/health");
        const data = await res.json();
        const opened = data.opened ? "live" : "waiting";
        document.getElementById("status").innerHTML =
          `<span class="dot">●</span> ${opened}`;
        document.getElementById("source").textContent = data.source || "";
        document.getElementById("fps").textContent = `ingest ${data.fps || 0} fps`;
        document.getElementById("motion").textContent = data.last_motion
          ? `motion area ${data.motion_area}`
          : "no motion";
        const dets = (data.last_detections || [])
          .map((d) => `${d.cls} ${d.conf}`)
          .join(", ");
        document.getElementById("dets").textContent = dets || "no objects";
        if (data.display) {
          document.getElementById("version").textContent = data.display;
        }
      } catch (err) {
        document.getElementById("status").textContent = "health error";
      }
    }
    refreshHealth();
    setInterval(refreshHealth, 1500);

    const sourceInput = document.getElementById("sourceInput");
    const modelInput = document.getElementById("modelInput");
    const modelOptions = document.getElementById("modelOptions");
    const applyBtn = document.getElementById("apply");
    const settingsMsg = document.getElementById("settingsMsg");

    function setMsg(text, kind) {
      settingsMsg.textContent = text;
      settingsMsg.className = "msg" + (kind ? " " + kind : "");
    }

    async function loadSettings() {
      const res = await fetch("/api/settings");
      if (!res.ok) throw new Error("settings failed");
      const data = await res.json();
      sourceInput.value = data.source || "";
      modelInput.value = data.model || "";
      modelOptions.innerHTML = (data.suggested_models || [])
        .map((name) => `<option value="${name}"></option>`)
        .join("");
    }

    document.getElementById("settings").addEventListener("submit", async (ev) => {
      ev.preventDefault();
      applyBtn.disabled = true;
      setMsg("Applying… live view will pause while the pipeline restarts.");
      try {
        const res = await fetch("/api/settings", {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            source: sourceInput.value,
            model: modelInput.value,
          }),
        });
        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.detail || "could not apply settings");
        }
        sourceInput.value = data.source || sourceInput.value;
        modelInput.value = data.model || modelInput.value;
        document.getElementById("stream").src = "/api/stream.mjpg?" + Date.now();
        setMsg("Applied. A new model may take a minute to download.", "ok");
        refreshHealth();
      } catch (err) {
        setMsg(err.message || "could not apply settings", "err");
      } finally {
        applyBtn.disabled = false;
      }
    });

    loadSettings().catch(() => setMsg("Could not load current settings.", "err"));
  </script>
</body>
</html>
