<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tundra — Live</title>
  <link rel="stylesheet" href="/app.css" />
</head>
<body data-page="live" data-seat="edge">
  <header class="top" id="chrome"></header>
  <main class="console">
    <p class="banner warn" id="verifyBanner" hidden></p>
    <ol class="cascade" id="handoff"></ol>
    <div class="live-grid">
      <section class="stage">
        <img id="stream" alt="Live camera" src="/api/stream.mjpg?seat=edge" />
        <p class="nosignal" id="nosignal" hidden>No camera on this host.</p>
        <div class="learn-hud" id="learnHud">
          <div class="learn-hud-top">
            <span id="learnLabel">Learning this camera</span>
            <span id="learnPct">0%</span>
          </div>
          <div class="bar thick"><span id="polBarHud"></span></div>
        </div>
        <div class="hud">
          <span class="pill wait" id="status">Connecting</span>
          <span class="pill" id="seatPill">Edge</span>
          <span class="pill wait" id="polPill">Learning…</span>
          <span class="pill err" id="noauthPill" hidden>NO AUTH</span>
        </div>
      </section>
      <aside class="rail" id="sceneCard">
        <p class="kicker" id="sceneKicker">Unusual for this camera?</p>
        <h2 id="scene">Waiting…</h2>
        <p class="lede" id="sceneSub"></p>
        <p class="why" id="whyDetail"></p>
        <div class="learn-block" id="learnBlock">
          <p class="kicker" id="learnKicker">This camera’s usual</p>
          <div class="bar thick"><span id="polBar"></span></div>
          <p class="lede" id="polLine"></p>
          <div class="heat" id="heat" hidden></div>
          <div class="meters" id="whyMeters"></div>
        </div>
        <div class="objects" id="objects"></div>
        <p class="models" id="modelLine"></p>
      </aside>
    </div>
    <details class="internals">
      <summary>Details</summary>
      <p class="lede" id="polLineDetails"></p>
      <div class="bar" aria-hidden="true"><span id="polBarDetails"></span></div>
      <table class="model-table" id="modelTable">
        <thead>
          <tr><th>Seat</th><th>Target</th><th>This process</th><th>This trip</th></tr>
        </thead>
        <tbody></tbody>
      </table>
      <dl class="facts" id="facts"></dl>
      <form class="fields" id="sourceForm">
        <input id="sourceInput" name="source" autocomplete="off" spellcheck="false"
          placeholder="RTSP URL, file path, or camera index (0)" />
        <button class="btn" type="submit">Set source</button>
      </form>
      <p class="msg" id="settingsMsg"></p>
    </details>
  </main>
  <script src="/app.js"></script>
  <script>TundraUI.live();</script>
</body>
</html>
