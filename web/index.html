<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tundra</title>
  <link rel="stylesheet" href="/app.css" />
</head>
<body data-seat="edge">
  <header class="top">
    <strong class="brand">Tundra</strong>
    <div class="seats" id="seats">
      <button type="button" data-seat="edge" class="on">Raspberry</button>
      <button type="button" data-seat="node">Node</button>
      <button type="button" data-seat="hub">Hub</button>
    </div>
    <nav>
      <a class="active" href="/">Live</a>
      <a href="/events">Activity</a>
    </nav>
  </header>
  <main class="wrap">
    <ol class="handoff" id="handoff"></ol>
    <section class="stage">
      <img id="stream" alt="Live camera" src="/api/stream.mjpg?seat=edge" />
      <div class="hud">
        <span class="pill wait" id="status">Connecting</span>
        <span class="pill" id="seatPill">Raspberry</span>
        <span class="pill" id="polPill">Learning…</span>
        <span class="pill" id="visionPill">Verifier</span>
      </div>
    </section>
    <section class="scene-card" id="sceneCard">
      <p class="kicker" id="sceneKicker">Unusual?</p>
      <h2 id="scene">Waiting…</h2>
      <p class="lede" id="sceneSub"></p>
      <div class="objects" id="objects"></div>
    </section>
    <details class="internals">
      <summary>Behind the scenes</summary>
      <p class="lede" id="polLine"></p>
      <div class="bar" aria-hidden="true"><span id="polBar"></span></div>
      <dl class="facts" id="facts"></dl>
      <form class="fields" id="sourceForm">
        <input id="sourceInput" name="source" autocomplete="off" spellcheck="false"
          placeholder="RTSP URL, file path, or camera index (0)" />
        <button class="btn" type="submit">Use camera</button>
      </form>
      <p class="msg" id="settingsMsg"></p>
    </details>
  </main>
  <script>
    const seatNames = { edge: "Raspberry", node: "Node", hub: "Hub" };
    const questions = { edge: "Unusual?", node: "What is it, and how long?", hub: "Alert or suppress?" };
    let seat = "edge";
    let currentSource = "";

    function esc(value) {
      return String(value ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    }

    function setSeat(next) {
      if (next === "operator") { location.href = "/events"; return; }
      if (next === "raspberry") next = "edge";
      if (!["edge", "node", "hub"].includes(next)) return;
      seat = next;
      document.body.dataset.seat = seat;
      document.querySelectorAll("#seats button").forEach((btn) => {
        btn.classList.toggle("on", btn.getAttribute("data-seat") === seat);
      });
      document.getElementById("seatPill").textContent = seatNames[seat];
      document.getElementById("stream").src = "/api/stream.mjpg?seat=" + seat + "&t=" + Date.now();
      refresh();
    }

    function renderHandoff(handoff) {
      const el = document.getElementById("handoff");
      const steps = (handoff && handoff.steps) || [];
      if (!steps.length) {
        el.innerHTML = "<li class=\"idle\">Raspberry → Node → Hub → Operator</li>";
        return;
      }
      el.innerHTML = steps.map((s) => {
        const stop = s.stage === (handoff.stopped_at || "");
        return `<li><button type="button" class="step ${s.decision} ${stop ? "stop" : ""}" data-stage="${s.stage}">
          <b>${s.label}</b><span>${s.decision}</span><em>${s.detail || ""}</em>
        </button></li>`;
      }).join("");
      el.querySelectorAll("button").forEach((btn) => {
        btn.addEventListener("click", () => setSeat(btn.getAttribute("data-stage")));
      });
    }

    async function applySource(source) {
      const msg = document.getElementById("settingsMsg");
      msg.textContent = "Switching…";
      try {
        const res = await fetch("/api/settings", {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ source }),
        });
        const data = await res.json().catch(() => ({}));
        if (res.status === 401) throw new Error("API token required for camera changes");
        if (!res.ok) throw new Error(data.detail || "failed");
        currentSource = data.source || source;
        document.getElementById("sourceInput").value = currentSource;
        document.getElementById("stream").src = "/api/stream.mjpg?seat=" + seat + "&t=" + Date.now();
        msg.textContent = "";
        msg.className = "msg";
        refresh();
      } catch (err) {
        msg.textContent = err.message || "failed";
        msg.className = "msg err";
      }
    }

    function shortName(path) {
      const s = String(path || "");
      const parts = s.split(/[/\\]/);
      return parts[parts.length - 1] || s || "—";
    }

    function fillInternals(data) {
      const pol = data.pol || {};
      const edge = (data.handoff || {}).edge || {};
      const node = (data.handoff || {}).node || {};
      const hub = (data.handoff || {}).hub || {};
      const need = pol.learn_samples || 40;
      const n = pol.samples || 0;
      const pct = Math.round((pol.progress || 0) * 100);
      const polPill = document.getElementById("polPill");
      if (pol.confident) {
        polPill.textContent = "PoL ready";
        polPill.classList.remove("wait");
      } else {
        polPill.textContent = "Learning " + pct + "%";
        polPill.classList.add("wait");
      }
      document.getElementById("polLine").textContent = pol.confident
        ? "This camera’s Pattern of Life is confident (" + n + " motion ticks on the grid)."
        : "Learning this camera’s usual footprint — " + n + " / " + need + " motion ticks. Edge uploads until then.";
      document.getElementById("polBar").style.width = Math.min(100, pct) + "%";
      const namerName = shortName(data.model) || "yolov8n";
      const namer = node.ran
        ? namerName + " (ran this trip)"
        : namerName + " (only on trips · idle)";
      const captionOn = data.vision && data.vision !== "off";
      const verifier = captionOn
        ? ((data.vision || "local") + (data.allow_cloud ? " · cloud allowed" : " · local only") + (hub.ran ? " (this trip)" : " · Hub verdict"))
        : "off";
      document.getElementById("visionPill").textContent = (data.vision || "local") + (data.allow_cloud ? "" : " · local");
      const tracks = (data.tracks || []).map((t) => "#" + t.id + " " + t.cls + " " + t.dwell_s + "s").join(", ") || "—";
      const escalate = data.escalation || {};
      const rows = [
        ["Pattern of Life", (pol.confident ? "confident" : "learning") + " · " + n + " / " + need + " motion ticks"],
        ["Unusual score", (edge.score != null ? Number(edge.score).toFixed(2) : "—") + (edge.reason ? " · " + edge.reason : "")],
        ["Occupancy / look", "place " + Number(edge.occupancy_novelty || 0).toFixed(2) + " · visual " + Number(edge.visual_delta || 0).toFixed(2)],
        ["Motion", "frame difference (OpenCV, no neural net)"],
        ["Namer", namer],
        ["Tracks", tracks],
        ["Verifier", verifier],
        ["Escalation", (escalate.mode || "recall") + " · R " + (escalate.raspberry_trips || 0) + " → N " + (escalate.node_proposals || 0) + " → Hub " + (escalate.hub_alerts || 0) + " alerts"],
        ["Camera", data.source || currentSource || "—"],
        ["Ingest", (data.fps || 0) + " fps · motion " + (data.motion_area || 0)],
      ];
      if (data.last_error) rows.push(["Error", data.last_error]);
      document.getElementById("facts").innerHTML = rows.map(([k, v]) =>
        `<dt>${k}</dt><dd>${esc(v)}</dd>`
      ).join("");
    }

    async function refresh() {
      try {
        const data = await (await fetch("/health")).json();
        const status = document.getElementById("status");
        status.className = "pill " + (data.opened ? "live" : "wait");
        status.textContent = data.opened ? "Live" : "Waiting";
        const handoff = data.handoff || {};
        const edge = handoff.edge || {};
        const node = handoff.node || {};
        const hub = handoff.hub || {};
        const pol = data.pol || {};
        const need = pol.learn_samples || 40;
        const n = pol.samples || 0;
        renderHandoff(handoff);
        fillInternals(data);
        document.getElementById("sceneKicker").textContent = questions[seat];
        const scene = document.getElementById("scene");
        const sub = document.getElementById("sceneSub");
        const objs = document.getElementById("objects");
        const card = document.getElementById("sceneCard");
        card.classList.toggle("alert", Boolean(hub.page_operator && seat === "hub"));
        const learnBit = pol.confident
          ? ""
          : " Learning " + n + "/" + need + " motion ticks.";
        if (seat === "edge") {
          if (!data.last_motion) {
            scene.textContent = "Quiet";
            sub.textContent = "Stays on the Pi." + learnBit;
          } else if (edge.upload) {
            scene.textContent = "Unusual";
            sub.textContent = (edge.reason || "Upload to Node.") + learnBit;
          } else {
            scene.textContent = "Usual";
            sub.textContent = "Stays on the Pi. No neural net." + learnBit;
          }
          objs.innerHTML = "";
        } else if (seat === "node") {
          const dets = node.received ? (node.classes || []) : [];
          if (!node.received) {
            scene.textContent = "Nothing from Edge";
            sub.textContent = "Usual frames never arrive. Namer is idle.";
          } else if (node.closed) {
            scene.textContent = (node.tracks && node.tracks.length) ? node.tracks.join(", ") : (dets.map((d) => d.cls).join(", ") || "Named");
            sub.textContent = "Closed. Hub is not asked.";
          } else {
            scene.textContent = (node.tracks && node.tracks.length) ? node.tracks.join(", ") : (dets.map((d) => d.cls).join(", ") || "Unsure");
            sub.textContent = "Send to Hub to adjudicate.";
          }
          objs.innerHTML = dets.map((d) => `<span>${d.track_id != null ? "#" + d.track_id + " " : ""}${d.cls}${d.dwell_s != null ? " " + d.dwell_s + "s" : ""}</span>`).join("");
        } else if (!hub.ran) {
          scene.textContent = "Idle";
          sub.textContent = "Node did not escalate.";
          objs.innerHTML = "";
        } else {
          scene.textContent = data.last_scene || hub.detail || "Describing…";
          sub.textContent = hub.page_operator ? "Needs an operator." : "Logged.";
          objs.innerHTML = (node.classes || []).map((d) => `<span>${d.cls}</span>`).join("");
        }
      } catch (err) {
        document.getElementById("status").textContent = "Error";
      }
    }

    async function load() {
      const data = await (await fetch("/api/settings")).json();
      currentSource = data.source || "";
      document.getElementById("sourceInput").value = currentSource;
    }

    document.getElementById("sourceForm").addEventListener("submit", (ev) => {
      ev.preventDefault();
      applySource(document.getElementById("sourceInput").value);
    });
    document.querySelectorAll("#seats button").forEach((btn) => {
      btn.addEventListener("click", () => setSeat(btn.getAttribute("data-seat")));
    });
    refresh();
    setInterval(refresh, 1500);
    load().catch(() => { document.getElementById("settingsMsg").textContent = "Could not load."; });
  </script>
</body>
</html>
