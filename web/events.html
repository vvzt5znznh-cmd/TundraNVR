<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tundra — Activity</title>
  <link rel="stylesheet" href="/app.css" />
</head>
<body>
  <header class="top">
    <div class="brand">
      <strong>Tundra</strong>
      <span class="tag">Building camera</span>
      <span id="version"></span>
    </div>
    <nav>
      <a href="/">Monitor</a>
      <a class="active" href="/events">Activity</a>
    </nav>
  </header>
  <main class="wrap">
    <div class="log-toolbar">
      <div>
        <p class="kicker">Log</p>
        <h2>What happened</h2>
        <p class="lede">Each clip is a moment the camera named something. Alerts are drones, aircraft, unattended bags, or anything unexpected.</p>
      </div>
      <div class="toggle" role="group" aria-label="Filter">
        <button type="button" id="allBtn" class="on">All</button>
        <button type="button" id="alertBtn">Alerts</button>
      </div>
    </div>
    <section class="grid-2">
      <div class="log-list" id="rows">
        <p class="empty">Loading…</p>
      </div>
      <aside class="player panel">
        <video id="player" controls playsinline></video>
        <p class="lede" id="detail" style="margin-top:12px">Select a moment to play the clip.</p>
        <p id="summary" style="margin:12px 0 0; font-size:15px;"></p>
      </aside>
    </section>
  </main>
  <script>
    const rowsEl = document.getElementById("rows");
    const player = document.getElementById("player");
    const detail = document.getElementById("detail");
    const summaryEl = document.getElementById("summary");
    const allBtn = document.getElementById("allBtn");
    const alertBtn = document.getElementById("alertBtn");
    let alertsOnly = false;
    let events = [];

    function esc(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function fmt(ts) {
      if (!ts) return "";
      const d = new Date(ts);
      return Number.isNaN(d.getTime()) ? ts : d.toLocaleString();
    }

    function headline(event) {
      if (event.summary) {
        const line = event.summary.split(/(?<=[.!?])\s/)[0];
        return line.length > 110 ? line.slice(0, 108) + "…" : line;
      }
      const classes = event.classes || [];
      if (!classes.length) return "Motion";
      return classes.join(", ");
    }

    function play(event) {
      for (const btn of rowsEl.querySelectorAll(".log-item")) btn.classList.remove("active");
      const row = document.getElementById("evt-" + event.id);
      if (row) row.classList.add("active");
      if (event.clip_url) {
        player.src = event.clip_url;
        player.play().catch(() => {});
      }
      detail.textContent = `${fmt(event.ts_start)} · ${(event.classes || []).join(", ") || "no labels"}`;
      const flag = event.anomaly ? `Alert: ${event.anomaly_reason || "unusual activity"}. ` : "";
      summaryEl.textContent = flag + (event.summary || "Note not ready yet — refresh in a few seconds.");
    }

    function render() {
      if (!events.length) {
        rowsEl.innerHTML = `<p class="empty">${alertsOnly ? "No alerts yet." : "Nothing logged yet. Leave the monitor running."}</p>`;
        return;
      }
      rowsEl.innerHTML = events.map((e) => `
        <button type="button" class="log-item ${e.anomaly ? "alert" : ""}" id="evt-${e.id}">
          ${e.thumb_url ? `<img class="thumb" src="${e.thumb_url}" alt="" />` : "<span></span>"}
          <div>
            <h3>${esc(headline(e))}</h3>
            <p class="meta">${esc(fmt(e.ts_start))}</p>
          </div>
          ${e.anomaly ? `<span class="badge">${esc(e.anomaly_reason || "alert")}</span>` : "<span></span>"}
        </button>
      `).join("");
      for (const e of events) {
        document.getElementById("evt-" + e.id).addEventListener("click", () => play(e));
      }
      play(events[0]);
    }

    async function loadEvents() {
      const res = await fetch("/api/events?limit=80" + (alertsOnly ? "&alerts=true" : ""));
      events = await res.json();
      render();
    }

    allBtn.addEventListener("click", () => {
      alertsOnly = false;
      allBtn.classList.add("on");
      alertBtn.classList.remove("on");
      loadEvents();
    });
    alertBtn.addEventListener("click", () => {
      alertsOnly = true;
      alertBtn.classList.add("on");
      allBtn.classList.remove("on");
      loadEvents();
    });

    loadEvents();
    fetch("/health")
      .then((res) => res.json())
      .then((data) => {
        if (data.display) document.getElementById("version").textContent = data.display;
      })
      .catch(() => {});
  </script>
</body>
</html>
