<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tundra — Events</title>
  <link rel="stylesheet" href="/app.css" />
</head>
<body data-page="events" data-seat="operator">
  <header class="top" id="chrome"></header>
  <main class="console">
    <div class="log-toolbar">
      <h2>Review</h2>
      <div class="toggle">
        <button type="button" id="allBtn" class="on">All</button>
        <button type="button" id="alertBtn">Alerts</button>
        <button type="button" id="unverifiedBtn">Unverified</button>
      </div>
    </div>
    <section class="grid-2">
      <div class="log-list" id="rows"><p class="empty">Loading…</p></div>
      <aside class="player panel">
        <p class="paged" id="pagedBecause"></p>
        <p class="kicker" id="spotKicker">Where it was spotted</p>
        <div class="spot" id="spotWrap">
          <img id="marked" alt="Marked still of the detection" hidden />
          <p class="empty" id="spotEmpty" hidden>Select a clip.</p>
        </div>
        <div class="objects" id="eventObjects"></div>
        <p class="why" id="whyLine"></p>
        <p class="lede" id="clipLabel">Clip</p>
        <video id="player" controls playsinline></video>
        <p class="lede" id="detail"></p>
        <ol class="cascade compact" id="detailHandoff"></ol>
        <p id="summary"></p>
        <div class="review">
          <button type="button" class="btn" id="confirmBtn">Incident</button>
          <button type="button" class="ghost" id="dismissBtn">Normal</button>
          <p class="lede" id="reviewMsg"></p>
        </div>
      </aside>
    </section>
  </main>
  <script src="/app.js"></script>
  <script>TundraUI.events();</script>
</body>
</html>
